<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Google Tag Manager, carregado no evento load (logo depois que a página termina de carregar).
         Assim o gtm.js nunca roda antes da primeira pintura, o que inflava o LCP no PageSpeed.
         O dataLayer começa já: page_view e cliques (whatsapp_click) ficam na fila e o GTM processa todos quando chega. -->
    <script>(function(w,d,i){w.dataLayer=w.dataLayer||[];w.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});function carregar(){var j=d.createElement('script');j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i;d.head.appendChild(j);}if(d.readyState==='complete')carregar();else w.addEventListener('load',carregar);})(window,document,'GTM-P2GJVCZW');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Modelo das páginas do blog. Título, descrição, canonical e dados estruturados de cada página
         entram no lugar do marcador abaixo (src/blog/seo.js), no build e no `npm run dev`. -->
    <!--blog-head-->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2C2824" />

    <!-- Fontes do próprio site (@font-face em src/index.css): o texto aparece já com a fonte de reserva e troca quando
         estas chegam. Preload só das usadas na primeira dobra: Inter (texto) e Cormorant (título). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin.woff2" crossorigin />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P2GJVCZW" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="min-h-screen bg-white text-brand-dark relative">
      <div id="cabecalho"><!--blog-cabecalho--></div>
      <!--blog-conteudo-->
      <div id="whatsapp"><!--blog-whatsapp--></div>
    </div>
    <script type="module" src="/src/blog/client.jsx"></script>
  </body>
</html>
